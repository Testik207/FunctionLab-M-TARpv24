<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#117c54"><title>FunctionLab</title><link rel="stylesheet" href="/css/site.css"><script defer src="/vendor/mathlive/mathlive.min.js"></script><script defer src="/vendor/chartjs/chart.umd.min.js"></script><script defer src="/js/i18n.js"></script><script defer src="/js/app.js"></script></head>
<body><div class="shell"><aside class="sidebar"><a class="brand" href="#research"><span class="brand-icon">ƒ</span><span>Function<span class="brand-light">Lab</span><small data-i18n="brandCaption"></small></span></a><div class="nav-label" data-i18n="workspace"></div><nav aria-label="Navigation"><button class="nav active" id="researchTab"><span>⌁</span><span data-i18n="research"></span></button><button class="nav" id="historyTab"><span>◷</span><span data-i18n="history"></span><b id="historyCount">—</b></button></nav></aside>
<main><header class="topbar"><div><span data-i18n="lab"></span> / <b id="breadcrumb"></b></div><div class="language-control"><label for="language" data-i18n="language"></label><select id="language" aria-label="Language"><option value="ru">Русский</option><option value="et">Eesti</option></select></div></header>
<section id="researchView"><div class="page-heading"><div><h1><span data-i18n="researchTitle"></span><span>.</span></h1><p data-i18n="intro"></p></div></div>
<div class="workspace"><section class="panel editor"><div class="panel-heading"><span class="step-badge">01</span><div><h2 data-i18n="yourFunction"></h2><p data-i18n="startFormula"></p></div></div><form id="analysisForm"><label for="formula" data-i18n="formulaLabel"></label><div class="math-input"><span>f(x) =</span><math-field id="formula" math-virtual-keyboard-policy="manual">x^3-3x</math-field></div><div id="compactKeyboard" class="compact-keyboard" role="group" aria-label="Math keyboard"></div><div class="keyboard-caption" data-i18n="keyboardHint"></div><div class="fallback" id="fallback"><label for="plainFormula" data-i18n="plainInput"></label><input id="plainFormula" value="x^3-3*x" maxlength="400"><small data-i18n="fallbackHint"></small></div><details class="syntax"><summary data-i18n="syntaxTitle"></summary><p data-i18n="syntaxText"></p></details><label data-i18n="intervalLabel"></label><div class="range-inputs"><div><span data-i18n="from"></span><input id="min" type="number" step="any" value="-5" min="-100" max="99.9" required></div><span class="range-dash">—</span><div><span data-i18n="to"></span><input id="max" type="number" step="any" value="5" min="-99.9" max="100" required></div></div><div class="input-help" data-i18n="intervalHint"></div><label class="tangent-label" for="tangentX" data-i18n="tangentX"></label><input id="tangentX" class="tangent-input" type="number" step="any" min="-100" max="100" value="0" required><button class="primary analyze" id="analyzeButton" type="submit"><span data-i18n="analyze"></span><span>→</span></button><div id="error" class="error" role="alert" hidden></div></form><div class="examples"><label data-i18n="tryExample"></label><button data-formula="x^3-3*x" data-latex="x^3-3x">x³ − 3x <span>↗</span></button><button data-formula="x^2-4*x+3" data-latex="x^2-4x+3">x² − 4x + 3 <span>↗</span></button><button data-formula="sqrt(x)" data-latex="\sqrt{x}">√x <span>↗</span></button><button data-formula="1/x" data-latex="\frac{1}{x}">1 / x <span>↗</span></button></div></section>
<section class="panel graph-panel"><div class="graph-heading"><div><span class="overline" data-i18n="visualization"></span><h2 data-i18n="graphTitle"></h2></div><div class="graph-tools"><button id="zoomIn">+</button><button id="zoomOut">−</button><button id="resetZoom">↺</button></div></div><div class="legend"><label><input type="checkbox" id="showFunction" checked><span class="line green"></span>f(x)</label><label><input type="checkbox" id="showDerivative" checked><span class="line dashed"></span>f′(x)</label><label><input type="checkbox" id="showTangent"><span class="line tangent-line"></span><span data-i18n="tangent"></span></label><label><input type="checkbox" id="showNormal"><span class="line normal-line"></span><span data-i18n="normal"></span></label><span id="plotRange"></span></div><div class="chart-wrap"><canvas id="funktsiooniGraafik" role="img"></canvas><div id="plotPlaceholder" class="plot-placeholder" data-i18n="plotPlaceholder"></div></div><div class="graph-foot"><span><span class="status-dot"></span><span data-i18n="hoverHint"></span></span><span id="pointCount"></span></div></section></div>
<section id="results" hidden><div class="result-title"><div><div class="eyebrow" data-i18n="resultHeading"></div><h2 id="resultFormula"></h2></div><div class="result-actions"><button class="secondary" id="newButton" data-i18n="newResearch"></button><button class="primary" id="saveButton"></button></div></div><p id="scope" class="scope"></p><div class="result-grid"><article class="panel result-card"><span class="card-symbol">D</span><label data-i18n="domain"></label><p id="domainResult"></p></article><article class="panel result-card"><span class="card-symbol">E</span><label data-i18n="range"></label><p id="rangeResult"></p></article><article class="panel result-card"><span class="card-symbol">±</span><label data-i18n="parity"></label><p id="parityResult"></p></article><article class="panel result-card"><span class="card-symbol">0</span><label data-i18n="roots"></label><p id="rootsResult"></p></article><article class="panel result-card"><span class="card-symbol">f′</span><label data-i18n="derivative"></label><p id="derivativeResult"></p></article><article class="panel result-card"><span class="card-symbol">↗</span><label data-i18n="extrema"></label><p id="extremaResult"></p></article></div>
<div class="study-grid"><section class="panel study-panel"><h2 data-i18n="signsTitle"></h2><p class="scope" id="intervalScope"></p><div id="signResults"></div><h2 class="subheading" data-i18n="monotonicTitle"></h2><div id="monotonicResults"></div></section><section class="panel study-panel"><h2 data-i18n="lineTitle"></h2><div id="lineResults"></div><h2 class="subheading" data-i18n="tableTitle"></h2><div id="valueTable"></div></section></div>
<section class="panel study-panel optimization-panel"><h2 data-i18n="optimizationTitle"></h2><div id="optimizationResult"></div></section>
<section class="panel solution"><button id="solutionToggle" type="button" aria-expanded="false"><span class="step-badge">02</span><span><strong data-i18n="fullSolution"></strong><small data-i18n="solutionHint"></small></span><span id="solutionMark" class="toggle-mark">+</span></button><div id="solutionSteps" hidden></div></section>
</section><div class="bottom-note" data-i18n="bottomNote"></div></section>
<section id="historyView" hidden><div class="page-heading"><div><div class="eyebrow" data-i18n="yourStudies"></div><h1><span data-i18n="historyTitle"></span><span>.</span></h1><p data-i18n="historyIntro"></p></div><button class="secondary" id="refreshHistory" data-i18n="refresh"></button></div><div id="historyError" class="error" role="alert" hidden></div><div class="panel history-panel"><div class="history-head"><h2 data-i18n="savedStudies"></h2><span id="historyTotal"></span></div><div id="historyList"></div></div></section>
<footer>FunctionLab <span data-i18n="footer"></span></footer></main></div><div id="toast" role="status" hidden></div></body></html>
